[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "utilshub"
version = "1.0.0"
description = "Desktop productivity suite combining CV Sorter, DocPacker, File Picker, PDF Desk, Sheet Sync, and Workflow automation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "UtilsHub Team" }
]
dependencies = [
    "pymupdf>=1.24.0",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.2",
    "watchdog>=4.0.0",
    "rapidfuzz>=3.6.0",
    "tkinterdnd2>=0.3.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
utilshub = "utilshub.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

